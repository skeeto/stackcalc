name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CMakeLists.txt PROJECT_VERSION matches tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE_VERSION=${VERSION%-rc*}
          CMAKE_VERSION=$(grep -Po 'project\(stackcalc VERSION \K[^ ]+' CMakeLists.txt)
          if [[ "$BASE_VERSION" != "$CMAKE_VERSION" ]]; then
            echo "::error::tag v$VERSION does not match CMakeLists.txt PROJECT_VERSION ($CMAKE_VERSION)"
            exit 1
          fi

  build-macos:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Cache the FetchContent output (GMP, MPFR, wxWidgets) so wx
      # only rebuilds when its tarball URL/hash changes. ImageVersion
      # is GitHub's per-runner-image identifier — bumps when the
      # mac-14 image is refreshed (toolchain version moves with it).
      - name: Cache _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            deps-macos-${{ runner.os }}-${{ env.ImageVersion }}-

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSTACKCALC_BUILD_TESTS=OFF

      - name: Build
        # -j 2 keeps memory pressure manageable on the 14 GB mac-14
        # runner; cached _deps means the second-run cost is small
        # even at low parallelism. See build-windows for the swap-
        # thrashing failure mode this avoids on the smaller ubuntu
        # runner.
        run: cmake --build build --config Release -j 2

      # The app goes on unsigned (the linker's ad hoc signature) as a
      # tarball, which keeps the bundle's permissions and symlinks. The
      # sign-macos job signs it and makes the disk image.
      - name: Pack the app
        run: |
          mkdir out
          tar czf out/stackcalc.app.tar.gz -C build/bin stackcalc.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: stackcalc-macos-app
          path: out/stackcalc.app.tar.gz
          if-no-files-found: error

  # Signs the app with the Developer ID Application certificate, puts it
  # on a disk image beside a link to /Applications, then signs,
  # notarizes and staples the image, in a job of its own so that only
  # it sees the release environment's Apple secrets: the certificate, a
  # .p12 in base64 (MACOS_CERTIFICATE, with MACOS_CERTIFICATE_PASSWORD),
  # and an App Store Connect API key (MACOS_NOTARY_KEY, the .p8's text,
  # with MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER).
  sign-macos:
    needs: build-macos
    runs-on: macos-14
    environment: release
    env:
      IDENTITY: 'Developer ID Application: Christopher Wellons (A7AR282GVM)'
    steps:
      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: stackcalc-macos-app
          path: app

      # A keychain of the job's own, with a random password, which
      # codesign may use without asking, searched ahead of the others
      - name: Import the certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          pw=$(openssl rand -hex 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf %s "$MACOS_CERTIFICATE" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$pw" "$kc" >/dev/null
          # shellcheck disable=SC2046  # the list, one keychain per word
          security list-keychains -d user -s "$kc" \
              $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$kc" | grep -qF "\"$IDENTITY\""; then
              echo "::error::no identity \"$IDENTITY\" in the certificate"
              exit 1
          fi

      # The hardened runtime and a secure timestamp, as notarization
      # requires. APFS for the image, as CPack's (CMakeLists.txt).
      - name: Sign the app and make the disk image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE_VERSION=${VERSION%-rc*}
          stage=$RUNNER_TEMP/dmg
          mkdir "$stage"
          tar xzf app/stackcalc.app.tar.gz -C "$stage"
          codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" "$stage/stackcalc.app"
          codesign --verify --deep --strict --verbose=2 "$stage/stackcalc.app"
          ln -s /Applications "$stage/Applications"
          mkdir out
          dmg=out/stackcalc-${BASE_VERSION}-macos-arm64.dmg
          hdiutil create -volname stackcalc -srcfolder "$stage" \
              -fs APFS -format UDZO "$dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          echo "DMG=$dmg" >>"$GITHUB_ENV"

      # notarytool exits 0 whatever Apple decides, so its status is read
      - name: Notarize and staple
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          key=$RUNNER_TEMP/notary.p8
          printf '%s\n' "$MACOS_NOTARY_KEY" >"$key"
          out=$(xcrun notarytool submit "$DMG" --key "$key" \
              --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" \
              --wait 2>&1) || true
          echo "$out"
          if ! grep -q 'status: Accepted' <<<"$out"; then
              id=$(sed -n 's/^ *id: \([0-9a-f-]*\).*/\1/p' <<<"$out" | head -n1)
              echo "::error::not notarized; Apple's reasons: xcrun notarytool log $id"
              exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature \
              --verbose "$DMG"

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: stackcalc-macos
          path: out/stackcalc-*-macos-arm64.dmg
          if-no-files-found: error

  build-windows:
    needs: verify-version
    # Cross-compile from Linux with mingw-w64 — no Windows runner
    # needed. The macOS job already runs the test suite against the
    # same source; Windows-side we just verify it builds and link
    # the binary statically (no DLL dependencies beyond the system
    # Win32 libraries).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # Cache the FetchContent output. The toolchain file is part of
      # the key because changing the mingw flags would otherwise
      # silently reuse incompatible objects. ImageVersion bumps when
      # the ubuntu image rolls (apt-installed mingw moves with it).
      - name: Cache _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-mingw-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('cmake/Fetch*.cmake', 'cmake/mingw-w64-x86_64.cmake') }}
          restore-keys: |
            deps-mingw-${{ runner.os }}-${{ env.ImageVersion }}-

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake

      - name: Build
        # -j 2 instead of -j (= 4) on the 7 GB ubuntu-latest runner.
        # Default parallelism caused wxWidgets compiles to thrash
        # swap and stall the build past the runner's stuck-detection
        # window, which read as a phantom cancellation at 88%.
        run: cmake --build build -j 2

      - name: Upload unsigned exe
        uses: actions/upload-artifact@v4
        with:
          name: stackcalc-windows-exe
          path: build/bin/stackcalc.exe
          if-no-files-found: error

  release:
    needs: [sign-macos, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # gh release create
      id-token: write   # aas-sign OIDC handshake
    steps:
      - uses: actions/checkout@v4   # for manual.md

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: stackcalc-macos
          path: dist

      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: stackcalc-windows-exe
          path: dist-windows

      - name: Sign stackcalc.exe
        uses: skeeto/aas-sign@v1.0.0
        with:
          endpoint:  ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          account:   ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          profile:   ${{ secrets.CERTIFICATE_PROFILE }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          files: dist-windows/stackcalc.exe

      - name: Assemble Windows ZIP, rename for -rc tags
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE_VERSION=${VERSION%-rc*}

          # Zip the signed exe + manual.md at archive root.
          STAGE=$(mktemp -d)
          cp dist-windows/stackcalc.exe "$STAGE/"
          cp manual.md "$STAGE/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/stackcalc-${BASE_VERSION}-windows-x64.zip" stackcalc.exe manual.md)

          # For -rc tags, rename both artifacts so user-facing download
          # filenames carry the full tag version. CPack only knows
          # PROJECT_VERSION (the base).
          if [[ "$VERSION" != "$BASE_VERSION" ]]; then
            mv "dist/stackcalc-${BASE_VERSION}-macos-arm64.dmg" \
               "dist/stackcalc-${VERSION}-macos-arm64.dmg"
            mv "dist/stackcalc-${BASE_VERSION}-windows-x64.zip" \
               "dist/stackcalc-${VERSION}-windows-x64.zip"
          fi
          ls -l dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Tags like vX.Y.Z-rcN are pipeline-test runs: publish as a
          # draft prerelease so they don't trigger release immutability
          # and can be deleted/retried freely.
          FLAGS=()
          if [[ "$VERSION" == *-rc* ]]; then
            FLAGS+=(--draft --prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            "${FLAGS[@]}" \
            "dist/stackcalc-${VERSION}-macos-arm64.dmg" \
            "dist/stackcalc-${VERSION}-windows-x64.zip"
